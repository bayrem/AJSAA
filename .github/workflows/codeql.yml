name: Code Quality

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"   # weekly Monday scan regardless of activity

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
