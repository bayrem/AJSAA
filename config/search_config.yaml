search:
  max_results_per_query: 10
  recency_days: 3               # Only return jobs posted within this many days
  validate_urls: true           # HEAD-check each job URL before storing; drops 4xx responses
  enable_job_boards: true
  enable_company_pages: true

# ── CV-to-positions mapping ───────────────────────────────────────────────────
# Maps each CV key to a list of target job titles (max 2 per CV used at runtime).
cvs:
  cv1:
    - "Product Manager Data AI"
    - "Head of Product Data AI"
  cv2:
    - ""
    - ""

# ── Target companies ──────────────────────────────────────────────────────────
# Supports three shapes:
#   plain string  → LLM discovers ATS on first run, result cached in hints_cache.json
#   hint entry    → skips LLM, uses the ATS slug directly (e.g. "greenhouse:slug")
#   url entry     → skips LLM, fetches jobs from that URL directly
# User-provided hint/url always overrides anything in hints_cache.json.
companies:
  - "Mistral AI"
  - name: "Hugging Face"
    hint: "greenhouse:huggingface"
  - name: "Criteo"
    url: "https://jobs.lever.co/criteo"

# ── Target locations ──────────────────────────────────────────────────────────
locations:
  - "Paris"
  - "Remote"
