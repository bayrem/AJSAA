agent:
  name: AJSAA
  version: "2.0.0"

llm:
  provider: claude_code_agent   # anthropic | openai | claude_code_agent
  scoring_model: claude-sonnet-4-6         # nuanced reasoning — job scoring
  search_model: claude-haiku-4-5-20251001  # structured extraction — queries, CV compression, web search
  default_model: claude-haiku-4-5-20251001
  max_tokens: 4096
  temperature: 0
  timeout: 120                  # seconds — used by claude_code_agent only

search:
  max_results_per_query: 10
  recency_days: 3               # Only return jobs posted within this many days
  validate_urls: true           # HEAD-check each job URL before storing; drops 4xx responses
  enable_job_boards: true
  enable_company_pages: true
  # Connectors run in order. Each entry can be a plain name (string) or a config object.
  # Object fields (all optional):
  #   enabled: true/false          — set false to skip without removing from config
  #   fallback_only: true/false    — only runs when all non-fallback connectors return 0 results
  #   max_results_per_query: N     — overrides global max_results_per_query for this connector
  #   max_queries: N               — run only the first N queries (saves tokens/API calls)
  connectors:
    # ── Real connectors (live data, no LLM tokens) ──────────────────────────
    - name: france_travail         # Official French gov API — free at francetravail.io/data/api
      enabled: true                # Requires: FRANCE_TRAVAIL_CLIENT_ID, FRANCE_TRAVAIL_CLIENT_SECRET
      max_results_per_query: 10
      max_concurrent: 3            # Respects their 3 req/s sustained rate limit

    - name: adzuna                 # Global aggregator, strong France coverage — free at developer.adzuna.com
      enabled: true                # Requires: ADZUNA_APP_ID, ADZUNA_APP_KEY
      max_results_per_query: 10
      max_concurrent: 5            # No documented rate limit; conservative default

    - name: indeed                 # Indeed FR — stub; RSS blocked, enable when connector implemented
      enabled: false               # Requires: no auth (RSS) or INDEED_PUBLISHER_ID (Publisher API)
      max_results_per_query: 10

    - name: wttj                   # Welcome to the Jungle — stub; enable when working endpoint found
      enabled: false               # No auth required once working endpoint confirmed
      max_results_per_query: 10

    - name: linkedin               # LinkedIn Jobs — stub; requires OAuth app approval
      enabled: false               # Requires: LINKEDIN_CLIENT_ID, LINKEDIN_CLIENT_SECRET
      max_results_per_query: 10

    - name: apec                   # APEC (French exec board) — stub; requires auth
      enabled: false               # Requires: session cookie or undocumented API reverse-engineering
      max_results_per_query: 10

    # ── Adaptive web search (Tavily → Brave → anthropic_web) ──────────────────
    - name: adaptive_web
      enabled: true                # Requires: TAVILY_API_KEY and/or BRAVE_SEARCH_API_KEY
      monthly_limit: 950           # Per-provider threshold before switching (not a hard cap)
      max_results_per_query: 5

    # ── LLM fallback (costs tokens — only fires when all other connectors return nothing) ─
    - name: anthropic_web
      enabled: true
      fallback_only: true          # Skipped automatically if any non-fallback connector returns results
      max_results_per_query: 5
      max_queries: 5               # Cap at 5 queries to limit token consumption
      # target_boards: [linkedin, wttj, indeed, apec]
      #   Optional list of job boards to target. When set, each query is issued once per
      #   board with a site:domain filter injected into the LLM search prompt (e.g.
      #   site:linkedin.com). Supported values: linkedin, wttj, indeed, apec, glassdoor,
      #   monster, cadremploi. Absence of this field preserves the current broad-search
      #   behaviour exactly.
      # max_queries_per_board: 3
      #   Cap on the number of queries run per board when target_boards is active.
      #   Applied as min(max_queries, max_queries_per_board) so neither cap is exceeded.
      #   Has no effect when target_boards is not set.

scoring:
  mode: llm                     # llm | static | hybrid
  min_score: 70                 # Jobs below this score are discarded
  max_score: 95                 # Cap — avoids inflated "perfect" scores
  max_cvs: 5                    # Maximum number of CV profiles to load
  uncertainty_band: [60, 80]    # hybrid: jobs in this range are re-scored by LLM
  profiles_dir: scoring_profiles/  # hybrid/static: where per-CV profiles are stored

storage:
  provider: local               # local | google_drive | onedrive | dropbox
  local_path: .data/jobs.json
  sheet_name: AJSAA Job Search

notifications:
  enabled: true
  channels: [telegram]          # [email, slack, telegram, whatsapp]
  email:
    subject: "AJSAA — Job Search Report"

logging:
  level: INFO
  file: logs/job_search.log
  rotation: none        # none | daily | per_run
  retention: 7          # files/days to keep (per_run: file count; daily: day count)
